name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true
      - name: Recreate Android Project
        run: |
          rm -rf android ios web macos linux windows test
          flutter create . --project-name sellem_game --platforms=android --org com.example.sellem
          flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: SELLEM-V3-APK
          path: build/app/outputs/flutter-apk/app-release.apk
